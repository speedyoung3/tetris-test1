<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>TETRIS — 블록을 쌓아보세요</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Tetris 홈">
          <span class="brand-mark" aria-hidden="true">T</span>
          <div>
            <p class="eyebrow">CLASSIC ARCADE</p>
            <h1>TETRIS</h1>
          </div>
        </div>
        <div class="status-pill" id="status-pill"><span class="status-dot"></span><span id="status-text">플레이 중</span></div>
      </header>

      <main class="game-layout">
        <section class="board-column" aria-label="게임 영역">
          <div class="board-header">
            <div>
              <p class="eyebrow">STACK. CLEAR. REPEAT.</p>
              <h2>최대한 오래 버텨보세요</h2>
            </div>
            <div class="board-size">10 <span>×</span> 20</div>
          </div>

          <div class="board-wrap">
            <div id="game-board" class="game-board" role="grid" aria-label="테트리스 게임판"></div>
            <div class="board-scanline" aria-hidden="true"></div>
            <div id="game-overlay" class="game-overlay is-hidden" aria-live="polite">
              <div class="overlay-card">
                <span class="overlay-icon" id="overlay-icon">✦</span>
                <p class="eyebrow" id="overlay-eyebrow">GAME OVER</p>
                <h2 id="overlay-title">게임 오버</h2>
                <p id="overlay-message">블록이 맨 위까지 쌓였습니다.</p>
                <div class="overlay-result" id="overlay-result">최종 점수 <strong>0</strong></div>
                <button class="primary-button" id="overlay-action" type="button">다시 하기</button>
              </div>
            </div>
          </div>

          <div class="mobile-controls" aria-label="터치 조작">
            <button class="control-button" data-action="left" type="button" aria-label="왼쪽 이동">←</button>
            <button class="control-button" data-action="rotate" type="button" aria-label="시계 방향 회전">↻</button>
            <button class="control-button control-button--drop" data-action="hard" type="button" aria-label="즉시 떨어뜨리기">↓<span>DROP</span></button>
            <button class="control-button" data-action="right" type="button" aria-label="오른쪽 이동">→</button>
          </div>
        </section>

        <aside class="info-column" aria-label="게임 정보">
          <section class="score-card panel-card">
            <div class="card-label"><span class="label-dot"></span> SCORE</div>
            <div class="score-value" id="score">000000</div>
            <div class="score-meta">
              <div><span>LEVEL</span><strong id="level">01</strong></div>
              <div><span>LINES</span><strong id="lines">00</strong></div>
            </div>
          </section>

          <section class="next-card panel-card">
            <div class="card-heading">
              <div>
                <div class="card-label"><span class="label-dot label-dot--pink"></span> NEXT BLOCK</div>
                <p>다음 블록</p>
              </div>
              <span class="piece-index">01</span>
            </div>
            <div class="preview-wrap"><div id="next-preview" class="next-preview" aria-label="다음 블록 미리보기"></div></div>
          </section>

          <section class="controls-card panel-card">
            <div class="card-label"><span class="label-dot label-dot--mint"></span> CONTROLS</div>
            <div class="key-list">
              <div class="key-row"><span>이동</span><div class="key-pair"><kbd>←</kbd><kbd>→</kbd></div></div>
              <div class="key-row"><span>회전</span><kbd>↑</kbd></div>
              <div class="key-row"><span>빠르게 내리기</span><kbd>↓</kbd></div>
              <div class="key-row"><span>즉시 내리기</span><kbd class="wide-key">SPACE</kbd></div>
              <div class="key-row"><span>일시정지</span><kbd>P</kbd></div>
            </div>
          </section>

          <div class="action-row">
            <button class="secondary-button" id="pause-button" type="button"><span id="pause-icon">Ⅱ</span><span id="pause-label">일시정지</span></button>
            <button class="secondary-button restart-button" id="restart-button" type="button"><span>↻</span> 다시 시작</button>
          </div>
          <p class="tip"><span>TIP</span> 한 번에 4줄을 지우면 <strong>800 × 레벨</strong> 점수를 얻어요.</p>
        </aside>
      </main>

      <footer class="footer-note"><span class="footer-line"></span><span>모든 블록은 네 개의 정사각형으로 이루어져 있어요</span><span class="footer-line"></span></footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
